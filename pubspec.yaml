name: fundsync
description: A Flutter + Firebase startup funding and loan management app.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"


dependencies:
  flutter:
    sdk: flutter
  url_launcher: ^6.3.0

  # --- Firebase ---
  firebase_core: ^4.2.0
  firebase_auth: ^6.1.1
  cloud_firestore: ^6.0.3
  firebase_storage: ^13.0.3
  firebase_messaging: ^16.0.3

  # --- Utilities & Core Packages ---
  google_fonts: ^6.2.1
  flutter_dotenv: ^6.0.0
  provider: ^6.1.2
  http: ^1.2.2
  intl: ^0.20.2

  # --- UI & Visualizations ---
  fl_chart: ^1.1.1
  lottie: ^3.3.0
  open_filex: ^4.5.0
  file_picker: ^10.3.3
  path_provider: ^2.1.3
  permission_handler: ^12.0.1
  flutter_local_notifications: ^19.4.2
  animated_text_kit: ^4.2.3
  page_transition: ^2.1.0

  # --- Excel Handling ---
  excel: ^4.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_logo.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/app_logo.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/fonts/
    - .env
